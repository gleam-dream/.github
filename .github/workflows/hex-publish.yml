name: Publish to Hex

# Called by a package repository when a release tag is pushed. The tag is
# `v<version>` for the package at the repository root, or
# `<package>-v<version>` for a package elsewhere in the repository. The
# caller's tag filter decides which packages may be published.
#
# The upload uses an API key, so Hex holds the release until a maintainer
# approves it on hex.pm with a second factor (staged publishing). This
# workflow never makes a version public by itself when that setting is on.

on:
  workflow_call:
    secrets:
      HEXPM_API_KEY:
        description: A Hex key with `publish:<package>` and `api:read`.
        required: true

permissions:
  contents: read

concurrency:
  group: hex-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Hex
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # Every tool the checks and the upload call comes from this
      # repository's flake at the commit named here. To change the
      # application, merge the change first, then move this commit.
      - name: Check the tag and publish
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
          TOOLING: github:gleam-dream/.github/4963fe0e5bc6f33f2406a61b4179f4773f220c1b
        run: nix run "$TOOLING#hex-publish"
